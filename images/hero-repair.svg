<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050A14"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D2A50"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg)"/>
  
  <!-- Glow orbs -->
  <circle cx="150" cy="150" r="120" fill="#0066FF" opacity="0.08" filter="url(#blur)"/>
  <circle cx="480" cy="300" r="100" fill="#00D4FF" opacity="0.06" filter="url(#blur)"/>
  
  <!-- Grid lines -->
  <g stroke="#0066FF" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="75" y1="0" x2="75" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="225" y1="0" x2="225" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="375" y1="0" x2="375" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="525" y1="0" x2="525" y2="450"/>
  </g>
  
  <!-- Laptop body -->
  <rect x="100" y="80" width="400" height="260" rx="12" fill="#0A1628" stroke="#1A3A6A" stroke-width="2"/>
  
  <!-- Screen bezel -->
  <rect x="112" y="92" width="376" height="238" rx="8" fill="#050A14"/>
  
  <!-- Screen content - motherboard visualization -->
  <rect x="120" y="100" width="360" height="222" rx="4" fill="url(#screen)"/>
  
  <!-- PCB traces -->
  <g stroke="#0066FF" stroke-width="1" opacity="0.4" fill="none">
    <polyline points="140,160 200,160 200,200 280,200"/>
    <polyline points="140,180 190,180 190,240 320,240"/>
    <polyline points="350,130 350,170 420,170 420,200"/>
    <polyline points="300,130 300,180 380,180 380,220 430,220"/>
    <polyline points="180,280 260,280 260,260 360,260"/>
  </g>
  
  <!-- Components on board -->
  <!-- CPU chip -->
  <rect x="230" y="140" width="80" height="80" rx="4" fill="#0D2A50" stroke="#0066FF" stroke-width="1.5"/>
  <rect x="238" y="148" width="64" height="64" rx="2" fill="#071830" stroke="#0044CC" stroke-width="1"/>
  <text x="270" y="185" text-anchor="middle" fill="#00D4FF" font-size="8" font-family="monospace" font-weight="bold">CPU</text>
  <text x="270" y="196" text-anchor="middle" fill="#4A8AAA" font-size="6" font-family="monospace">CORE</text>
  
  <!-- RAM slots -->
  <rect x="160" y="145" width="55" height="20" rx="2" fill="#0A2040" stroke="#0055DD" stroke-width="1"/>
  <text x="187" y="159" text-anchor="middle" fill="#0066FF" font-size="7" font-family="monospace">RAM</text>
  <rect x="160" y="170" width="55" height="20" rx="2" fill="#0A2040" stroke="#0055DD" stroke-width="1"/>
  <text x="187" y="184" text-anchor="middle" fill="#0066FF" font-size="7" font-family="monospace">RAM</text>
  
  <!-- Capacitors -->
  <circle cx="350" cy="155" r="6" fill="#0D2A50" stroke="#00D4FF" stroke-width="1"/>
  <circle cx="368" cy="155" r="6" fill="#0D2A50" stroke="#00D4FF" stroke-width="1"/>
  <circle cx="386" cy="155" r="6" fill="#0D2A50" stroke="#00D4FF" stroke-width="1"/>
  <circle cx="404" cy="155" r="6" fill="#0D2A50" stroke="#00D4FF" stroke-width="1"/>
  
  <!-- Battery connector area -->
  <rect x="340" y="200" width="90" height="40" rx="3" fill="#0A1E3C" stroke="#1A3A6A" stroke-width="1"/>
  <text x="385" y="224" text-anchor="middle" fill="#4A6A8A" font-size="7" font-family="monospace">BATT</text>
  
  <!-- Soldering tool -->
  <line x1="420" y1="95" x2="340" y2="175" stroke="#00D4FF" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glow-filter)"/>
  <circle cx="340" cy="175" r="5" fill="#00D4FF" opacity="0.9"/>
  <rect x="415" y="85" width="30" height="14" rx="3" fill="#1A3A6A"/>
  
  <!-- Glow dot at soldering point -->
  <circle cx="340" cy="175" r="8" fill="#00D4FF" opacity="0.2"/>
  
  <!-- Active indicator dots -->
  <circle cx="140" cy="115" r="3" fill="#00E676">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="115" r="3" fill="#00D4FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data flow animation -->
  <circle r="3" fill="#0066FF" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 140,160 L 200,160 L 200,200 L 280,200"/>
  </circle>
  <circle r="2" fill="#00D4FF" opacity="0.6">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1s" path="M 350,130 L 350,170 L 420,170 L 420,200"/>
  </circle>
  
  <!-- Laptop keyboard area -->
  <rect x="100" y="345" width="400" height="8" rx="2" fill="#0A1628"/>
  
  <!-- Keyboard keys (simplified) -->
  <g fill="#0D2A50" rx="2">
    <rect x="110" y="356" width="380" height="60" rx="6" fill="#0A1628" stroke="#1A3A6A" stroke-width="1"/>
  </g>
  
  <!-- Bottom bar / trackpad indicator -->
  <rect x="230" y="370" width="140" height="30" rx="4" fill="#0D1F3C" stroke="#1A3A6A" stroke-width="1"/>
  
  <!-- Brand badge overlay -->
  <rect x="130" y="310" width="120" height="28" rx="6" fill="rgba(0,102,255,0.15)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
  <text x="190" y="329" text-anchor="middle" fill="#00D4FF" font-size="10" font-family="sans-serif" font-weight="bold">⚡ NexCore</text>
  
  <!-- Status indicator -->
  <circle cx="450" cy="310" r="6" fill="#00E676">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="462" y="314" fill="#00E676" font-size="9" font-family="sans-serif">ACTIVE</text>
</svg>
